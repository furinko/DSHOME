<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSHOME 自救台</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    margin: 0; padding: 24px;
    background: #f5f6f8; color: #1a1d23;
    display: flex; flex-direction: column; align-items: center;
  }
  .wrap { width: 100%; max-width: 860px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: #666; margin: 0 0 16px; font-size: 13px; }
  .tip {
    background: #fff8e1; border: 1px solid #f0d47c; border-radius: 8px;
    padding: 10px 14px; font-size: 14px; line-height: 1.6; margin-bottom: 16px;
  }
  .tip b { color: #b26a00; }
  .ok { background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 8px; padding: 8px 14px; font-size: 14px; margin-bottom: 12px; }
  .err { background: #ffebee; border: 1px solid #ef9a9a; border-radius: 8px; padding: 8px 14px; font-size: 14px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 14px; vertical-align: middle; }
  th { background: #fafafa; font-weight: 600; color: #444; }
  tr:last-child td { border-bottom: none; }
  .name { font-weight: 600; font-family: ui-monospace, Consolas, monospace; font-size: 13px; word-break: break-all; }
  .desc { color: #555; font-size: 13px; }
  .state { font-size: 13px; }
  .on { color: #2e7d32; } .off { color: #9e9e9e; }
  button {
    font-size: 13px; padding: 6px 16px; border-radius: 6px; border: 1px solid #ccc;
    cursor: pointer; background: #fff; white-space: nowrap;
  }
  button:hover { border-color: #888; }
  button.danger { color: #c62828; border-color: #e0a3a3; background: #fff5f5; }
  button.danger:hover { background: #ffe0e0; }
  button.primary { color: #1565c0; border-color: #9fc1e8; background: #f0f6ff; }
  button.primary:hover { background: #dcebfd; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .foot { color: #888; font-size: 13px; margin-top: 18px; line-height: 1.7; }
  code { background: #eee; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
  a.back { display: inline-block; margin-left: 8px; font-size: 13px; color: #1565c0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛟 DSHOME 自救台</h1>
  <p class="sub">这个页面不加载任何插件，所以它永远能打开。页面刚才崩了？多半是某个插件坏了——把它停用再重启即可。</p>
  <div class="tip">💡 <b>怎么判断是哪个插件：</b>崩溃提示里点名的（如 <code>loaded without registering "xxx"</code> 里的 xxx）就是它；没有点名就选<b>最近新装/改过的</b>。<a class="back" href="/">我其实没事，返回主界面 →</a></div>
  <div id="status" class="ok">正在读取插件列表…</div>
  <div id="msg"></div>
  <table>
    <thead>
      <tr><th style="width:26%">插件</th><th>说明</th><th style="width:10%">状态</th><th style="width:16%">操作</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="foot">连这个页面都打不开？说明<b>后端</b>崩了（前端问题后端一定是活的）。请在终端运行：<code>node scripts/plugin-change-guard.mjs --recover</code></p>
</div>
<script>
(function () {
  var rows = document.getElementById('rows');
  var status = document.getElementById('status');
  var msgBox = document.getElementById('msg');
  function showMsg(text, isErr) {
    msgBox.innerHTML = '';
    var d = document.createElement('div');
    d.className = isErr ? 'err' : 'ok';
    d.textContent = text;
    msgBox.appendChild(d);
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function fetchList() {
    fetch('/api/dshome/plugins').then(function (r) { return r.json(); }).then(function (data) {
      if (!data || !data.ok) throw new Error((data && data.error) || '接口异常');
      status.textContent = '后端连接正常，共 ' + data.plugins.length + ' 个插件';
      render(data.plugins);
    }).catch(function (e) {
      status.className = 'err';
      status.textContent = '读取失败：' + e.message + '（如果连这个都失败，说明后端未就绪）';
    });
  }
  function render(list) {
    rows.innerHTML = '';
    list.forEach(function (p) {
      var tr = document.createElement('tr');
      var name = p.moduleName || p.entryId || '';
      var td1 = document.createElement('td');
      td1.className = 'name';
      td1.textContent = name;
      var td2 = document.createElement('td');
      td2.className = 'desc';
      td2.textContent = (p.description && p.description !== name) ? p.description : '（无中文描述）';
      var td3 = document.createElement('td');
      td3.className = 'state';
      td3.innerHTML = p.enabled ? '<span class="on">运行中</span>' : '<span class="off">已停用</span>';
      var td4 = document.createElement('td');
      if (p.protected && p.enabled) {
        var hint = document.createElement('span');
        hint.className = 'off';
        hint.textContent = '核心，不可停';
        td4.appendChild(hint);
      } else {
        var btn = document.createElement('button');
        if (p.enabled) { btn.className = 'danger'; btn.textContent = '停用'; }
        else { btn.className = 'primary'; btn.textContent = '启用'; }
        btn.addEventListener('click', function () {
          btn.disabled = true;
          fetch('/api/dshome/plugins/toggle', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ id: p.entryId || p.moduleName, enabled: !p.enabled })
          }).then(function (r) { return r.json(); }).then(function (res) {
            if (res.ok) {
              showMsg((p.enabled ? '已停用：' : '已启用：') + name + '（' + (res.message || '') + '）');
              fetchList();
            } else if (res.protected) {
              showMsg('核心插件运行中，不可停用：' + name, true);
              fetchList();
            } else {
              showMsg('操作失败：' + (res.message || res.error || '未知错误'), true);
              btn.disabled = false;
            }
          }).catch(function (e) {
            showMsg('操作失败：' + e.message, true);
            btn.disabled = false;
          });
        });
        td4.appendChild(btn);
      }
      tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3); tr.appendChild(td4);
      rows.appendChild(tr);
    });
  }
  fetchList();
})();
</script>
</body>
</html>
