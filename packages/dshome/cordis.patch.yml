# DSHOME bundle patch: the third patch layer of profile `dshome`,
# applied after @deepseek-ai/dsh-base and @deepseek-ai/dsh-web-app.
# Design: 设计文档已归档移除（2026-08-31），护栏设计要点见各 host 插件头部注释

# -- 自有 host 插件 --
- insert:
    # dshome-core: 扩展点服务（commands/panels 注册表），未来所有 DSHOME 插件的地基。
    - id: dshome-core
      name: dshome/core
    # dshome-shell（Phase 2）：Electron 薄壳窗口/托盘/单实例/离线重连。
    - id: dshome-shell
      name: dshome/shell
    # dshome-theme（Phase 3）：DSHOME 品牌皮肤（强调色 token + 品牌槽）。
    # 裸包名行保证 roster 扫描到 dsh.client；根导出为 CJS 插件对象。
    - id: dshome-theme
      name: dshome-theme
    # dshome-palette（主线 A）：Ctrl+K 命令面板。
    - id: dshome-palette
      name: dshome-palette
    # dshome-notify（主线 A 第 2 步）：回合级通知，开关在「设置 → 通知」。
    - id: dshome-notify
      name: dshome/notify
    # dshome-plugin-manager（block 1）：已装插件 列表 + 启/停。
    - id: dshome-plugin-manager
      name: dshome/plugin-manager
    # dshome-plugin-center（client）：左侧边栏插件管理中心（sidebar.footer.action 入口）。
    - id: dshome-plugin-center
      name: dshome-plugin-center
    # dshome-assistant-identity（client）：对话区助手形象——通用设置两行（名字+头像）+ 对话区注入。
    - id: dshome-assistant-identity
      name: dshome-assistant-identity
    # dshome-mind（host+client）：心智可视化面板——/api/mind/* 双区读取 + better-sidebar「心智」tab。
    - id: dshome-mind
      name: dshome-mind
    # dshome-mind-inject（host）：心智 L0 注入（折中版）——每个会话开始时注入一次
    # L0 摘要（AGENTS/SOUL/TOOL/HUB/Wisdom 关键决策规则），不是每轮，省 token。
    - id: dshome-mind-inject
      name: dshome/mind-inject
    # dshome-mind-guard（host）：心智护栏（执行面）——用官方 ctx.tools.guard() 在 write/edit
    # 真正写入前拦一次：① 隐私红线（禁写出厂区 mind\）② 自我修改门禁（改自我类文件须过 validate）。
    # 只做拦、不做注入（单一职责）。fail-open：护栏失效≠host 崩溃。
    - id: dshome-mind-guard
      name: dshome/mind-guard
    # dshome-mind-recall（host）：上工自动召回——每个主会话第一步机器注入 mind-prime
    # 产物（project 进度/待办 + L3 相关记忆 + Learn 教训 + user-rules），不靠 agent 记得跑。
    # 与 mind-inject 职责互补：inject 管静态纪律摘要，recall 管动态记忆召回；空机优雅降级。
    - id: dshome-mind-recall
      name: dshome/mind-recall
    # dshome-desktop（market 装/卸）：自供 desktopProfiles/desktopPnpm/
    # desktopPlugins/desktopActions 四服务，让 dsh-community-market 的安装/卸载
    # 脱离 DSH Desktop（纯 dsh CLI + pnpm）即可工作；requestRestart 只发信号。
    # 默认 disabled（2026-09-01 起产品默认，原 L4 覆盖并入）：desktopPnpm 接口
    # { run } 与 dshmarket 期望的 { runPlugin } 不匹配，启用会报
    # service.runPlugin is not a function；禁用后 dshmarket 检测不到桌面服务，
    # 回退普通 dsh plugin CLI 路径（已验证可用）。
    - id: dshome-desktop
      name: dshome/desktop
      disabled: true

# -- 覆盖官方行（整体替换 config，不合并）--
- id: web-runtime
  config:
    openBrowser: false
    printUrl: true
    surfaceContext: true
    trustedHosts: []

# 专属默认端口：与官方 web（3080）错开（旧基线 3081 已弃，2026-09-01 对齐 3099）；
# launcher（DSHOME.exe / 开发启动.cmd）显式 --port 3099 同值；CLI --port 仍优先。
- id: webserver
  config:
    host: !!js ctx.webStartup.host ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? 3099

# 官方品牌由 dshome-theme 的品牌槽替代。
- id: ui-brand-official
  disabled: true

# 解锁 UI 填 API Key（2026-09-01 起产品默认，原 L4 覆盖并入）：apiKeyEnv 指向不存在的
# 变量名（DSHOME_USER_KEY），官方 UI 判定「引用的 env 无值 → 需要用户提供」→ 输入框可编辑，
# 用户填的 key 存 dsh 凭证库（dsh-credentials-local），之后自动解析。
# 若 apiKeyEnv 指向真实存在的环境变量，UI 会锁定只读「由启动环境提供」。
- id: llm-deepseek
  config:
    apiKeyEnv: DSHOME_USER_KEY
