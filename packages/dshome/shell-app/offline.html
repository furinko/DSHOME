<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>DSHOME — 后端未连接</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #0f1420; color: #dbe4f0; height: 100vh; display: grid; place-items: center;
    }
    .card { text-align: center; max-width: 480px; padding: 48px 32px; }
    .logo { font-size: 42px; font-weight: 800; letter-spacing: 1px; color: #4d6bfe; }
    h1 { font-size: 20px; margin: 18px 0 8px; }
    p { color: #8fa3c0; font-size: 14px; line-height: 1.7; }
    .url { font-family: ui-monospace, Consolas, monospace; color: #b9c9e2; background: #1a2233; border-radius: 8px; padding: 4px 10px; display: inline-block; margin: 12px 0; }
    button {
      margin-top: 18px; background: #4d6bfe; color: #fff; border: 0; border-radius: 8px;
      padding: 10px 22px; font-size: 14px; cursor: pointer;
    }
    button:hover { background: #6480ff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">DSHOME</div>
    <h1>后端未连接</h1>
    <p>DSH 服务没有在 <span class="url" id="url"></span> 上运行</p>
    <p>请先用 <code>dsh --profile dshome</code> 启动后端；<br />后端恢复后窗口会自动重连。</p>
    <button id="retry">立即重试</button>
  </div>
  <script>
    (function () {
      var target = new URLSearchParams(location.search).get('url') || '';
      var host = '';
      try { host = new URL(target).host; } catch (e) {}
      document.getElementById('url').textContent = host || '127.0.0.1:3081';
      document.getElementById('retry').addEventListener('click', function () {
        location.href = target || 'http://127.0.0.1:3081';
      });
    })();
  </script>
</body>
</html>
